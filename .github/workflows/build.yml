name: Build XHSPlugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid

    - name: Install Theos
      run: |
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Build
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: XHSPlugin-deb
        path: packages/*.deb

    - name: Extract and upload dylib
      run: |
        mkdir -p output
        for deb in packages/*.deb; do
          dpkg -x "$deb" extracted
        done
        if [ -f "extracted/Library/MobileSubstrate/DynamicLibraries/XHSPlugin.dylib" ]; then
          cp extracted/Library/MobileSubstrate/DynamicLibraries/XHSPlugin.dylib output/
          cp extracted/Library/MobileSubstrate/DynamicLibraries/XHSPlugin.plist output/
        fi

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: XHSPlugin-dylib
        path: output/
